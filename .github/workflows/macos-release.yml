name: macOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        run: |
          set -euo pipefail
          npx electron-builder --mac dir --arm64 --x64 --publish never -c.mac.identity=-
          chmod +x "scripts/Open Bridge.command"
          pack() {
            local src="$1"
            local dest="$2"
            local stage
            stage="$(mktemp -d)"
            mkdir -p "$stage/Bridge"
            cp -R "$src" "$stage/Bridge/Bridge.app"
            cp "scripts/Open Bridge.command" "$stage/Bridge/Open Bridge.command"
            chmod +x "$stage/Bridge/Open Bridge.command"
            rm -f "$dest"
            ditto -c -k --keepParent "$stage/Bridge" "$dest"
          }
          version="${GITHUB_REF_NAME#v}"
          pack "release/mac-arm64/Bridge.app" "release/Bridge-${version}-arm64-mac.zip"
          pack "release/mac/Bridge.app" "release/Bridge-${version}-mac.zip"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: softprops/action-gh-release@v2
        with:
          files: release/Bridge-*.zip
          generate_release_notes: true
