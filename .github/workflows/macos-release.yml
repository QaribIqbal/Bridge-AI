name: macOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y zip unzip
      - run: npm ci
      - run: npm run build
      - name: Package Intel
        run: npx electron-builder --mac zip --x64 > "$RUNNER_TEMP/builder-x64.log" 2>&1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder
      - name: Show Intel log
        if: failure()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 150 "$RUNNER_TEMP/builder-x64.log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Package Apple silicon
        run: npx electron-builder --mac zip --arm64 > "$RUNNER_TEMP/builder-arm64.log" 2>&1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder
      - name: Show Apple silicon log
        if: failure()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 150 "$RUNNER_TEMP/builder-arm64.log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
